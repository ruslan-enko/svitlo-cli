# Ruff configuration.
#
# The ruleset is pinned here on purpose: CI installs the latest ruff, and the
# default selection changes between releases, which previously turned the lint
# job red without any change to this repository.
line-length = 120

# Virtualenvs with non-standard names (.venv-ci, venv311, ...) would otherwise
# be linted as project code.
extend-exclude = ["*venv*"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return statements
    "LOG",  # logging misuse
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
]
ignore = [
    # Ukrainian text is intentional; confusable-character warnings are noise.
    "RUF001",
    "RUF002",
    "RUF003",
    # Long exception messages carry useful context in the log.
    "TRY003",
]